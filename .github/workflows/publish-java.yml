name: Publish java/ to GitHub Packages (Maven)

on:
  push:
    branches:
      - main
    paths:
      # Must match the working-directory below. It said `java/**`, which no
      # longer exists -- so this workflow has not fired on a push since the
      # fixtures were moved under fixtures/ecosystems/.
      - "fixtures/ecosystems/java/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fixtures/ecosystems/java
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Publish to GitHub Packages
        run: mvn --batch-mode deploy -DskipTests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
