on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fixtures/parent
          - fixtures/ecosystems/java
          - fixtures/ecosystems/python
          - fixtures/ecosystems/typescript
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check target exists
        id: check
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ -d "$TARGET" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7.0.0
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.13.15"

      # Deliberately unpinned, unlike every other tool install in the org. This
      # repo exists to check the fixtures against whatever reqstool currently
      # releases; pinning would test them against a fixed past version and stop
      # catching the regressions it is named for.
      - name: Install reqstool
        if: steps.check.outputs.exists == 'true'
        run: pip install reqstool

      - name: Validate ${{ matrix.target }}
        if: steps.check.outputs.exists == 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: reqstool status local -p "$TARGET"
